name: Native Android APK

on:
  push:
    branches: [main, master, native-android-final, native-android-timetable-v1.1]
  pull_request:
    branches: [main, master, native-android-final]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: native-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test native Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify native project
        run: |
          test -f android/gradlew
          test -f native-android/app/build.gradle.kts

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Preserve the generated debug signing key between builds so APK updates
      # use the same certificate. The currently installed APK may need one final reinstall.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: one-percent-debug-signing-key-v1-${{ github.ref_name }}

      - name: Run native unit tests
        run: ./android/gradlew -p native-android testDebugUnitTest --no-daemon --stacktrace

      - name: Build native debug APK
        run: ./android/gradlew -p native-android assembleDebug --no-daemon --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: one-percent-habits-native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
