# Build a debug APK for 1% Habits (Capacitor + Android)
#
# Triggers:
#   - Push to main/master
#   - Manual "Run workflow" from the Actions tab
#   - New GitHub Release (uploads APK to the release)
#
# Prerequisites (once, on your machine):
#   npm install
#   npm run build:mobile
#   npx cap add android
#   git add android/ && git commit -m "Add Capacitor Android platform"
#
# The android/ folder must be committed for this workflow to work.

name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build mobile web assets
        run: npm run build:mobile

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            echo "android/ folder missing — run 'npx cap add android' locally and commit it."
            exit 1
          fi

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under android/app/build/outputs/apk"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-percent-habits-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
